<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Sub Scribe">
  <title>Sub Scribe</title>
  <desc>A screen holding a scribe writing on the subtitle box; a green arrow feeds subtitles in, a blue one drains them out.</desc>
  <rect width="1024" height="576" fill="#121826"/>
  <!-- screen frame -->
  <rect x="375.875" y="148.875" width="273.000" height="163.000" rx="13" fill="none" stroke="#dce1eb" stroke-width="8"/>
  <!-- screen stand -->
  <path fill="#788296" d="M 435.0,315.0 L 435.0,316.0 L 461.0,316.5 L 458.8,319.2 L 458.8,320.5 L 456.8,322.2 L 456.8,323.5 L 454.8,325.2 L 454.8,326.5 L 452.8,328.2 L 452.8,329.5 L 450.8,331.2 L 450.8,332.5 L 448.8,334.2 L 448.8,335.5 L 446.8,337.2 L 446.8,338.5 L 444.8,340.2 L 444.8,341.5 L 442.8,343.2 L 442.8,344.5 L 441.8,345.2 L 442.2,346.0 L 582.5,346.0 L 583.0,345.2 L 582.0,344.5 L 582.0,343.2 L 580.0,341.5 L 580.0,340.2 L 578.0,338.5 L 578.0,337.2 L 576.0,335.5 L 576.0,334.2 L 574.0,332.5 L 574.0,331.2 L 572.0,329.5 L 572.0,328.2 L 570.0,326.5 L 570.0,325.2 L 568.0,323.5 L 568.0,322.2 L 566.0,320.5 L 566.0,319.2 L 563.8,316.5 L 589.8,316.0 L 589.8,315.0 Z"/>
  <!-- subtitle box with its two text lines -->
  <rect x="448.875" y="264.875" width="127.000" height="31.000" rx="6" fill="none" stroke="#dce1eb" stroke-width="4"/>
  <rect x="457.875" y="271.875" width="109.0" height="5.0" fill="#dce1eb"/>
  <rect x="457.875" y="283.875" width="109.0" height="5.0" fill="#dce1eb"/>
  <!-- scribe: head, shoulders, the arm reaching down to write, and the pen -->
  <circle cx="497" cy="179" r="15.5" fill="#f3f5f9"/>
  <path fill="#f3f5f9" d="M 472.0,240.5 C 472.0,212.0 480.5,201.0 497.0,201.0 C 513.5,201.0 522.0,212.0 522.0,240.5 Z"/>
  <path fill="none" stroke="#f3f5f9" stroke-width="10.5" stroke-linecap="round"
        d="M 515.5,214.0 C 529.0,219.5 539.0,228.5 547.0,239.0"/>
  <path fill="none" stroke="#32cd78" stroke-width="7.5" stroke-linecap="round"
        d="M 545.0,237.0 L 560.5,250.0"/>
  <circle cx="561.5" cy="251.0" r="4.2" fill="#32cd78"/>
  <!-- input arrow -->
  <path fill="#32cd78" d="M 450.0,231.2 L 422.0,210.5 L 421.0,220.0 L 250.5,220.0 L 250.0,242.5 L 420.2,242.8 L 421.5,243.5 L 421.5,252.2 L 422.2,252.5 Z"/>
  <!-- output arrow -->
  <path fill="#3c96ff" d="M 805.0,231.2 L 774.2,208.8 L 773.5,219.8 L 574.0,219.8 L 573.0,220.8 L 573.0,242.2 L 574.2,243.2 L 773.5,243.2 L 773.8,253.8 L 774.5,254.0 L 798.5,236.0 L 799.5,236.0 Z"/>
  <!-- wordmark: jetzt Text statt nachgezeichneter Kontur; braucht eine serifenlose Schrift -->
  <text x="512" y="440.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="35" font-weight="600" fill="#ffffff">Sub Scribe</text>
</svg>
