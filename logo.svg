<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Sub Scribe">
  <title>Sub Scribe</title>
  <desc>A screen holding a scribe — yellow head, blue body, a pen in hand — writing on the subtitle box; a green arrow feeds subtitles in, a blue one drains them out.</desc>
