name: "SubDL Scribe"
guid: "7d1c5a2e-3f4b-4d6e-9a8b-5c2f8e1d4a9b"
version: "12.1.12.204"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "nrg80"
overview: "Sync subtitles with SubDL — download missing and upload new subtitles."
description: >
  SubDL Scribe brings SubDL.com to Jellyfin: it downloads missing
  subtitles for the languages and libraries you pick and uploads your own.
  Download is on by default; upload is off — enable at your choice.
  Requires a SubDL login and API Key plus a TMDb API Key.
category: "Subtitles"
artifacts:
- "Jellyfin.Plugin.SubdlSync.dll"
- "LanguageDetection.dll"
- "LiteDB.dll"
changelog: >
  v12.1.12.204: A library scan is ~50x faster. The store committed once per ROW — and a commit is a
    disk sync — so a pass over prod's library issued 9 644 writes at 45 ms each and ran eight minutes
    while queueing nothing. Writes now accumulate and commit in batches, and observing an embedded
    track no longer restamps its parent media row once per track. Same workload: 4 800 writes in
    2 846 ms instead of 138 650 ms.
  v12.1.12.203: A run that uploaded subtitles is no longer marked failed afterwards. The status row
    for the audio alignment was written on the upload path too, where there is no download to report,
    so every upload run threw and both the Download and Upload lights turned red although both had
    finished green. The row is skipped when there is no download. Also: a failed unpack during a
    deploy no longer leaves a half-installed plugin.
  v12.1.12.202: The data store is SQLite now, through the Entity Framework Core that Jellyfin already
    ships, and the plugin writes its own file (subdl-scribe.sqlite) — never Jellyfin's database, which
    offers plugins no interface and is rebuilt by its own migrations. A new version that meets an old
    data file IMPORTS it once: measured against a real file, 117 of 117 rows over ten areas, including
    the retry budgets and the burned-candidate verdicts, which are work rather than data — losing them
    re-fetches candidates that were already screened. The old file is kept. 35 KB smaller package
    (1,337,266 -> 1,301,728 B): not the full engine weight, because the import still needs it to read.
  Older entries (before v12.1.12.192) were removed on 08.10.2026 to keep this file
  and the shipped ZIP small. They remain in the git history: git log -- build.yaml .
  v12.1.12.201: The configuration page carries its JavaScript once. The second page
    script was never loaded (measured in a browser), so it, its ConfigJs route, its
    page registration and its resource entry are gone — 65 KB less in the DLL.
  v12.1.12.200: The auto-sync is a worker of its own now: it is handed the subtitle and
    hands back a status and its output, instead of the download guessing its outcome.
    Its row goes red for its own failures only, not for the download's.
  v12.1.12.199: Two statistics rows are gone, and with them their counters: the type row and
    the year-filter row. The behaviour they measured is unchanged - the file name still
    decides type and episode, a year-filtered search still retries without the year.
  v12.1.12.198: The worker is named Auto-Sync too, like the statistics row, and the numbers
    under Statistics are right-aligned in a column sized for six digits.
  v12.1.12.197: Spelling: the statistics row reads "Downloads: Auto-Sync".
  v12.1.12.196: Shorter statistics rows: "Downloads: searches run without the year"
    and "Type (movie/series) adjusted, both dir".
  v12.1.12.195: The auto-sync's light lives in the Workers list and nowhere else - the copy
    under the download switch is gone. One readout, one place.
  v12.1.12.194: The statistics row is shorter now: "Downloads: Auto-Synch" instead of the long
    sentence that restated the switch. A row in a table of counts names its counter.
  v12.1.12.193: The audio alignment has its own status light now - in the Workers list and
    directly under the download switch, with the same words and colours as every other worker.
    The switch says what it does at last: "Automatically synchronize subtitle to spoken track".
    The statistics count only alignments that really happened, so a subtitle that was already
    fine is no longer reported as one that the run moved. The postprocessing row is named for
    its direction: "Upl. Postproc.".
  v12.1.12.192: A subtitle the alignment finds nothing wrong with is no longer treated as a
    failure. It is kept as the best version of its language, taking index 01 upward like a
    corrected file, together with an identical copy from index 99 downward - and the download
    stops there instead of hunting further candidates, which no longer spends quota on a file
    that cannot be beaten. Only files that are actually wrong (beyond the shift limit, too few
    cues) keep going into the reserved range and keep the hunt alive.
