name: "SubDL Scribe"
guid: "7d1c5a2e-3f4b-4d6e-9a8b-5c2f8e1d4a9b"
version: "12.1.12.233"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "nrg80"
overview: "Sync subtitles with SubDL — download missing and upload new subtitles."
description: >
  SubDL Scribe brings SubDL.com to Jellyfin: it downloads missing
  subtitles for the languages and libraries you pick and uploads your own.
  Download is on by default; upload is off — enable at your choice.
  Requires a SubDL login and API Key plus a TMDb API Key. Created by AI
  under the directions of the maintainer.
category: "Subtitles"
artifacts:
- "Jellyfin.Plugin.SubdlSync.dll"
- "LanguageDetection.dll"
- "LiteDB.dll"
changelog: >
  v12.1.12.233: Clean-up round on the settings page and the plugin text. The database section now
    speaks of the plugin database throughout and its restore line is one sentence; the three cadence
    menus spell the non-automatic choice "Manual", and a stored "Never" reads as Manual; upload
    postprocessing defaults to Weekly for fresh installations. The plugin's description ends with
    "Created by AI under the directions of the maintainer." on the card and in the catalog, and every
    SubDL search names the integration.
  v12.1.12.232: Follow-up to 231 — the identifying agent now rides on every SubDL call, not only on
    the main ones. The plugin builds its SubDL clients at several places, and four of them (the
    status probe, the quota read, the upload postprocessing check and the upload pipeline's own
    pass) sent no agent at all, so their calls arrived unidentified. One factory builds all of them
    now.
  v12.1.12.231: The database refresh now refreshes the query statistics as well, and SubDL can see
    who is calling. The refresh ran VACUUM alone — that shrinks the file but leaves the query
    planner guessing which index to use. It now runs ANALYZE in the same pass, which costs one
    database page; measured on this schema, the plan for one of the plugin's own lookups moved off
    the worse index and onto the selective one. Separately, every API call now names the
    integration (client=other) and carries the real plugin version in its User-Agent, which until
    now reported "1.0" for every release.
  v12.1.12.230: Timestamps show local time again on a server that does not run on UTC.
    Run times, the statistics period and diagnostics came from the database without a
    timezone designator, and browsers read such a value as LOCAL time — on a Berlin
    server a run stored as 07:36 UTC read 7:36 AM although it happened at 9:36 AM. The
    stamps are now marked as UTC before formatting. Also: the refetch description names
    its two directions outright, "both download and upload".
  v12.1.12.229: Removes an experimental subtitle-alignment method that shipped in 228 by
    mistake. Nothing a run does changes - the alignment is the same one 227 used, unchanged.
  v12.1.12.228: The Auto-Sync numbers in the log are written with a decimal point, not with
    whatever separator the machine prefers. The same line read "t = +8,62" on one day and
    "t = +8.62" on the next, from unchanged code, because interpolated numbers follow the
    host culture. Nothing about the alignment itself changed.
  v12.1.12.227: The Auto-Sync row is reachable while it runs. Start and finish sat in one
    synchronous block, so the light was never blue and its duration read as ~0. It now opens
    with the download run and is closed by whoever opened it - including a cancelled run.
  v12.1.12.226: Every gate in "Quality gates (before upload)" names its default. Three of the five
    (minimum cue count, validate SRT, check sync) had none - the two written later did, which is how
    the gap arose. A default is what makes a switch readable without flipping it.
  v12.1.12.225: The upload switch reads "Continue after daily limit" like the download one - the
    extra "API" made two controls that do the same thing look like they behave differently.
  v12.1.12.224: "Target languages (download, required)" is a real heading now, and it names the
    direction. It was a field caption (label in an inputContainer) whose text did not say whose
    languages, while every other block on the General tab is introduced by an h3.
  v12.1.12.223: Target languages (download, required) moves to the General tab, directly under
    the library selection, so the first page carries what a run needs. Moved, not copied - a
    second control would render on both tabs and the last one read would win at save.
  v12.1.12.222: A worker row may not claim work the run did not do. The Download row stored
    "20 downloaded, 22 unavailable, 1 skipped" while carrying DryRun=1, and the run's own log
    line said "20 would have saved" - DescribeDirectionRun took the summaries but never the
    mode. The label now follows the log's words ("would have saved" / "would have uploaded");
    the counters are untouched, because a dry run's numbers are honest about what it FOUND.
  v12.1.12.221: The dry run consumes no work. The download outcome handler read the UPLOAD
    dry-run flag, so a download dry run marked every item it had only described as Done and the
    next real run skipped them. Each direction now consults its own flag. And the Auto-Sync row
    is STARTED as well as finished - it was only ever closed, so it reported a stale start time
    (prod: nine hours for 274 s of alignment).
  v12.1.12.220: A DOWNLOAD dry run escapes the DOWNLOAD brake, not the search one. With the account
    at 50/50 the probe from F-M331 held back the very run meant to report what WOULD happen, so the
    dry-run test could not be started at all. A dry run fetches no file, so the download counter no
    longer stops it; the search allowance keeps holding it in both modes, because a dry run does
    search every item and prints only what those answers carry.
  v12.1.12.219: "Only missing languages" gets a real second mode. Off now means once per language,
    whatever the file already carries: only our own recorded download closes a pair, so library
    sidecars, embedded tracks and the stream list stop counting. The fetched file is numbered against
    the files actually in the directory instead of overwriting the one already there, and the label
    drops its old "(embedded count as present)" parenthetical.
  v12.1.12.218: Three page texts. The reset warning is one short sentence again ("Deletes all persistent
    state. A backup is kept. Rebuild costs API quota."), the postprocessing description drops its trailing
    pointer at the button beneath it, and the "Only missing languages" checkbox states its default (on).
  v12.1.12.217: file-retry is removed from code and GUI - the file-missing give-up, its setting and
    its tracker type are gone. The gone-file case is the Database Refresh's job now (new phase 1b,
    path-keyed and behind the same root fail-safe as its neighbours), which is what the operator's
    "alleinige Aufgabe database refresh" asks for. Two page texts corrected with it: the reset warning
    no longer claims the dedup state survives (it is exactly what a reset deletes), and the pacing
    field drops its "rate, not a limit" aside.
  v12.1.12.216: All three maintenance menus now read just "Manual" - the appended "no scheduled run,
    use the button below" is gone. The button sits directly under its description; nothing else changed.
  v12.1.12.215: The postprocessing button now starts the scheduled task instead of calling the job's
    API endpoint. Both run the work, but only the task writes the status row - measured on prod, the endpoint
    finished correctly while the list stayed empty, so the run looked like it never happened.
  v12.1.12.214: The upload binding on postprocessing now applies to the scheduled run only - a manual
    run always works, with the upload direction on or off. The two gates that refused a manual trigger
    are gone; the schedule itself is still held back while upload is disabled, and the page says so.
  v12.1.12.213: Upload postprocessing joins the other two jobs with a manual start button under its
    description, and its disabling option is now labelled "Manual" instead of "Never" - the stored
    value is unchanged, so an existing setting keeps meaning what it meant. Its button calls the job's
    own endpoint rather than the generic task starter, so a press with the upload direction switched
    off says so instead of looking like a finished run.
  v12.1.12.212: The id-resolution give-up is gone. An item whose id could not be resolved used to be
    retired after three failed attempts, which meant the ladder never ran again for it; now the next
    run tries again, and the setting with its field is gone. The database refresh and the OSHash
    refresh each got a manual start button on the configuration page, under their own description,
    and their disabling option is now labelled "Manual" instead of "Never" - the stored value is
    unchanged, so an existing configuration keeps meaning what it meant. The upload postprocessing
    interval keeps "Never" because it has no such button.
  v12.1.12.212: The id-resolution give-up is gone. An item whose id could not be resolved used to be
    retired after three failed attempts, which meant the ladder never ran again for it; now the next
    run tries again. The setting and its field are gone with it. Also: the database and OSHash
    refreshes each got a manual start button on the configuration page, under their own description,
    so they can be run on the spot instead of waiting for the schedule. Both changes keep every
    existing cadence setting exactly as it was.
  v12.1.12.211: Two settings became one. "Auto-Sync attempts and max. download/search limit" now
    decides how many candidates per language are SEARCHED and how many the downloader may pull
    before giving up; "Max candidates per language" is gone. At the old default of 3 the cap always
    stopped the walk first, so the correction attempts never took effect - the two numbers could
    contradict each other silently. With Auto-Sync on, only candidates the fit could not resolve
    count against the limit, not ones a quality gate refused. With Auto-Sync off the walk stopped
    after the first candidate of each language; it now pulls the configured number.
  v12.1.12.210: The allowance gate now works like the download switch, at the switch's own two
    places, and the check moved out of the seeder. The seeder fills queues and does not decide
    policy: it takes a plain flag beside DownloadEnabled and asks the API nothing. The dispatcher
    probes once per cycle before the download seed - only when the cycle covers the download
    direction - and a spent download OR search allowance then holds the queue back AND stops the
    run, exactly as switching the direction off does. A read that fails is not a verdict.
  v12.1.12.209: The IMDb/TMDb match loses its switch, and a spent allowance no longer starts the
    downloader. A filename-parsed title search could fetch a wrong-year release with the same name;
    the hard gate is the only position that stays correct, so the option went and not the gate. And
    the seeder now asks the SubDL counters once per scan, BEFORE it fills the download queue: with
    the 50/day download limit or the search allowance spent, the queue is not filled AND the run is
    refused, so a cycle stops costing its search allowance for saves that cannot happen. Measured on
    prod the day of the order: the download limit was spent from 05:59, and four further cycles each
    walked ~1000 queued items, spent the day's search allowance (59 -> 194) and saved nothing.
    An unreadable counter is NOT treated as spent - a network hiccup must not cost a day.
  v12.1.12.208: One lit lamp, for the worker that is working. The cycle marked both directions as
    running when it STARTED, so the Seeder scanned while Download and Upload were already blue from
    the same cycle. Each direction now marks itself when its own run begins and closes its own row,
    start to finish, so exactly one lamp is blue at a time. Also: the upload row counts the skips it
    really keeps (FilesSkipped), so a run that examined files and refused them all says so instead
    of reading as untouched.
  v12.1.12.207: A worker row no longer reads "nothing to do" for a run that examined items and
    refused them all. Live on prod: the upload looked at five files, rejected every one for a missing
    id, and its row said nothing had happened. The row now names the skipped count too.
  v12.1.12.206: Same fixes as 12.1.12.205, with the assembly version corrected. 205 shipped a
    DLL that still identified itself as 12.1.12.204, so Jellyfin installed the package while its
    loader reported the old assembly and the version never took effect. The release script now
    refuses a build whose AssemblyVersion and FileVersion disagree with the version.
  v12.1.12.205: Every worker row now reports only its own result - until now the green line handed
    the seeder's sentence to the download AND upload row, so two rows read identically. The scan also
    stopped printing the direction it never looked at, and the seeder row sums a both-direction cycle
    instead of letting the second leg overwrite the first. Settings page: the download tab reads in
    the order the cycle works - continue after daily limit, follow-up rounds, automatically
    synchronize. No setting changed value.
  v12.1.12.204: A library scan is ~50x faster. The store committed once per ROW — and a commit is a
    disk sync — so a pass over prod's library issued 9 644 writes at 45 ms each and ran eight minutes
    while queueing nothing. Writes now accumulate and commit in batches, and observing an embedded
    track no longer restamps its parent media row once per track. Same workload: 4 800 writes in
    2 846 ms instead of 138 650 ms.
  v12.1.12.203: A run that uploaded subtitles is no longer marked failed afterwards. The status row
    for the audio alignment was written on the upload path too, where there is no download to report,
    so every upload run threw and both the Download and Upload lights turned red although both had
    finished green. The row is skipped when there is no download. Also: a failed unpack during a
    deploy no longer leaves a half-installed plugin.
  v12.1.12.202: The data store is SQLite now, through the Entity Framework Core that Jellyfin already
    ships, and the plugin writes its own file (subdl-scribe.sqlite) — never Jellyfin's database, which
    offers plugins no interface and is rebuilt by its own migrations. A new version that meets an old
    data file IMPORTS it once: measured against a real file, 117 of 117 rows over ten areas, including
    the retry budgets and the burned-candidate verdicts, which are work rather than data — losing them
    re-fetches candidates that were already screened. The old file is kept. 35 KB smaller package
    (1,337,266 -> 1,301,728 B): not the full engine weight, because the import still needs it to read.
  Older entries (before v12.1.12.192) were removed on 08.10.2026 to keep this file
  and the shipped ZIP small. They remain in the git history: git log -- build.yaml .
  v12.1.12.201: The configuration page carries its JavaScript once. The second page
    script was never loaded (measured in a browser), so it, its ConfigJs route, its
    page registration and its resource entry are gone — 65 KB less in the DLL.
  v12.1.12.200: The auto-sync is a worker of its own now: it is handed the subtitle and
    hands back a status and its output, instead of the download guessing its outcome.
    Its row goes red for its own failures only, not for the download's.
  v12.1.12.199: Two statistics rows are gone, and with them their counters: the type row and
    the year-filter row. The behaviour they measured is unchanged - the file name still
    decides type and episode, a year-filtered search still retries without the year.
  v12.1.12.198: The worker is named Auto-Sync too, like the statistics row, and the numbers
    under Statistics are right-aligned in a column sized for six digits.
  v12.1.12.197: Spelling: the statistics row reads "Downloads: Auto-Sync".
  v12.1.12.196: Shorter statistics rows: "Downloads: searches run without the year"
    and "Type (movie/series) adjusted, both dir".
  v12.1.12.195: The auto-sync's light lives in the Workers list and nowhere else - the copy
    under the download switch is gone. One readout, one place.
  v12.1.12.194: The statistics row is shorter now: "Downloads: Auto-Synch" instead of the long
    sentence that restated the switch. A row in a table of counts names its counter.
  v12.1.12.193: The audio alignment has its own status light now - in the Workers list and
    directly under the download switch, with the same words and colours as every other worker.
    The switch says what it does at last: "Automatically synchronize subtitle to spoken track".
    The statistics count only alignments that really happened, so a subtitle that was already
    fine is no longer reported as one that the run moved. The postprocessing row is named for
    its direction: "Upl. Postproc.".
  v12.1.12.192: A subtitle the alignment finds nothing wrong with is no longer treated as a
    failure. It is kept as the best version of its language, taking index 01 upward like a
    corrected file, together with an identical copy from index 99 downward - and the download
    stops there instead of hunting further candidates, which no longer spends quota on a file
    that cannot be beaten. Only files that are actually wrong (beyond the shift limit, too few
    cues) keep going into the reserved range and keep the hunt alive.
