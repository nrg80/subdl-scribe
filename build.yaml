name: "SubDL Scribe"
guid: "7d1c5a2e-3f4b-4d6e-9a8b-5c2f8e1d4a9b"
version: "12.1.12.333"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "nrg80"
overview: "Sync subtitles with SubDL — download missing and upload new subtitles."
description: >
  SubDL Scribe brings SubDL.com to Jellyfin: it downloads missing
  subtitles for the languages and libraries you pick and uploads your own.
  Download is on by default; upload is off — enable at your choice.
  Requires a SubDL login and API Key plus a TMDb API Key. Created by AI
  under the directions of the maintainer.
category: "Subtitles"
artifacts:
- "Jellyfin.Plugin.SubdlSync.dll"
- "LanguageDetection.dll"
changelog: >
  v12.1.12.333: three preflight checks in the pack fill — mixed sources and already-refused tracks are refused before any extraction, and a second file of the same episode gets its own attempt (F-M442/F-M443/F-M444).
  v12.1.12.332: the pack fill keeps its texts in the run's working directory instead of a persistent store — gone when the run ends (F-M440/F-M441).
  v12.1.12.331: the pack fill takes the subtitle that is already uploaded instead of extracting every track of the file — no more ~900 MB held per run (F-M440).
  v12.1.12.330: a plugin-owned field that is new to the configuration file survives a restart — the partial writer clears xsi:nil and inserts at the declared position (F-M438).
  v12.1.12.329: the page ceiling of the postprocessing walk rises to 20000 so a large backlog is reachable in one catch-up run; the run itself stays watermark-bound (F-M437).
  v12.1.12.328: the postprocessing pages down to its own watermark and runs daily, so a published entry gets its entry id within a day instead of waiting for a weekly pass (F-M437).
  v12.1.12.327: a worker whose last run failed keeps saying so on the deferral line, instead of reading as a plain deferral (F-M436).
  v12.1.12.326: upload rows store the published entry id, not the upload id — packs, singles and movies alike, with the postprocessing remapping open submissions (F-M435).
  v12.1.12.325: the file witness of a season now finds its episodes at pack time (F-M434).
  v12.1.12.324: the pack plan asks the files, not only the store, so a first-time season becomes a pack (F-M433).
  v12.1.12.323: upload ids are also read from the published list, so movies and packs keep their delete handle (F-M432).
  v12.1.12.322: the pack filler tries every track of the language, not only the first (F-M431).
  v12.1.12.321: release group also reads bracketed brands, underscore pairs and a second extension (F-M430).
  v12.1.12.320: release group recognition covers dot, space and bracketed spellings — 60% to 71% on the operator library (F-M430).
  v12.1.12.319: season packs go up before the single uploads, and covered singles are skipped (F-M429).
  v12.1.12.318: archive cache defaults are now 7 days and 256 MB (F-M428).
  v12.1.12.317: a database reset purges the archive cache with it (F-M427).
  v12.1.12.316: a season whose languages are all inside a pack is not investigated at all (F-M426).
  v12.1.12.315: the pack rule is the same for every trigger — a pack is built only when this run queued the whole season, and only out of those items (F-M425).
  v12.1.12.314: an arrival run builds a pack when the episodes it brought are the whole season, and only out of those queued items (F-M424).
  v12.1.12.313: already published uploads can be adopted into the registry (POST /Plugins/SubdlSync/AdoptUploads) so seasons the seeder filled become packable.
  v12.1.12.312: a refused season names the three closest languages with their counts and the missing episodes, plus any episode without an uploaded row.
  v12.1.12.311: every single upload names its SubDL id in the log — from the answer or fetched from mySubtitles — and an upload without one warns instead of staying silent.
  v12.1.12.310: the log line for a language that is not complete on every episode no longer promises single uploads — it says that no pack is built for it and this pass sends nothing.
  v12.1.12.309: arrival runs upload single only; a refetch or manual run uploads every position single first and then closes the season with the pack, which deletes the singles it absorbs.
  v12.1.12.308: the pack questions are asked in cost order — store first (already up? language complete?), release names second, extraction last.
  v12.1.12.307: completeness is decided per language from the store, before any extraction — an incomplete language goes up as singles.
  v12.1.12.306: a season already up as a pack is skipped before the extraction, not after it.
  v12.1.12.305: a pack resolves its SubDL id from mySubtitles the same way a single does — matched by release name, language by its written name.
  v12.1.12.304: a single upload resolves its SubDL id from mySubtitles right after the upload — without it a pack can never delete the single it replaces.
  v12.1.12.303: a pack names every member whose single upload carries no SubDL id in the store — uploaded by us, but not deletable.
  v12.1.12.302: dry carries the same grey as cancel; the filler hashes a file once and the cache logs a hit once per file.
  v12.1.12.301: A season counts as complete only when one release group supplies all its episodes — a staffel split across two groups stays single.
  v12.1.12.300: The aired episode set comes from TMDb and no longer counts episodes whose air date is in the future — IMDb had answered with the whole series (20 instead of 7).
  v12.1.12.299: The pack loop reports progress, so the watchdog no longer aborts a run that is busy building packs.
  v12.1.12.298: The pack filler reads a file once per run instead of once per language — 37 languages of one season no longer mean 37 full container passes.
  v12.1.12.297: A running worker reports the live dry flag, so the workers line reads "run dry" while the run is in flight instead of only afterwards.
  v12.1.12.296: One spelling for the mode — "dry" inline in the start lines, "DRY-RUN" as the prefix on event lines; the dry-run=True form is gone.
  v12.1.12.295: The cycle lines in the log say whether the cycle ran dry — "cycle start (..., dry)" and the matching end line.
  v12.1.12.294: A worker in dry mode says so while it runs — the workers line reads "run dry" instead of only turning grey after the run.
  v12.1.12.293: The language line in the log states the finding — tagged X, detected Y, uploaded under Y — instead of calling the tag a liar.
  v12.1.12.292: Only a packs row proves a pack now — a single upload's own id no longer passes for "already inside a pack", which had quietly excluded 98 seasons that were never packed.
  v12.1.12.291: The workers line marks a dry worker with the single word "dry", right beside the outcome word, so the blue run tag and the marker read as one line.
  v12.1.12.290: A pack is refused outright when any of its members came from SubDL itself — downloaded, or unpacked out of a downloaded pack.
  v12.1.12.289: A pack already up with the same members is not sent twice, and the database refresh drops pack rows nothing carries any more instead of disabling a season forever.
  v12.1.12.288: A pack is never built from a subtitle that was only downloaded — the filler demands an uploaded row of that very track, so a download cannot be published back under our name.
  v12.1.12.287: One rule for season packs — every complete season is packed, the queue only orders the members and the fill closes the gap; a partly queued season no longer drains into single uploads.
  v12.1.12.286: The pack brake and the series allow-list are gone again — a probe knob has no place in the build; the pack path does what the library and the config already say.
  v12.1.12.285: A run can be braked (packs per run, checked before anything is deleted) and aimed (pack only for these series), so a library-wide pack wave starts as a probe.
  v12.1.12.284: A single upload that a later season pack absorbs is deleted from SubDL first, the pack keeps its ids on record, and the toggle says so.
  v12.1.12.283: A season pack is filled with subtitles that are already up instead of falling back to singles, is remembered in its own table so it is never rebuilt, and the quota bar reads API calls.
  v12.1.12.282: One archive fetch serves the season; a refused file gets the next one from the same archive, an unreadable cue is dropped before the hash is taken, and kept originals are numbered from 51.
  v12.1.12.278: The hearing-impaired (SDH) subtitle states it in its name — .SDH after the language code —
  in the pack title, in the pack member and in the single upload, instead of only in the hi field.
  v12.1.12.277: Pack members name their season, so SubDL no longer files them under season zero.
  v12.1.12.276: Pack members name no season, which is what SubDL filed as a single episode.
  v12.1.12.275: A season pack states no episode range, which is what made SubDL file it as episode one.
  v12.1.12.274: A lying language tag is corrected on upload, and a pack without a release in its names is named after the file's own resolution, source and codec.
  v12.1.12.273: A pack names a release only when every episode comes from that one release.
  v12.1.12.272: A pack carries the season form of the release names, so it is titled like a season.
  v12.1.12.271: A season pack is titled by its first release, so that entry names the season (F-M374).
  v12.1.12.270: The arrival debounce window defaults to two minutes instead of one.
  v12.1.12.269: A dry run names the season pack it would send instead of one line per episode.
  v12.1.12.268: A season pack is planned before the run: only a season whose queued episodes are the whole aired season is packed, and its episodes are worked consecutively so the pack closes in one go.
  v12.1.12.267: Corrected subtitles take slots 01 to 49 and kept originals 50 to 99, both counting up from the bottom of their block.
  v12.1.12.266: Season packs are on by default and the switch sits directly above the upload gates.
  v12.1.12.265: A season whose episodes are all present and pass the checks goes up as one pack instead of one subtitle per episode.
  v12.1.12.264: A file that already carries a Norwegian subtitle is no longer given a second one, whichever written form the existing subtitle uses.
  v12.1.12.263: Subtitle packs are cached per archive rather than per download URL and stay on
    disk for 14 days, so a season pack is not fetched again for every episode.
  v12.1.12.262: The run cache now also holds large archives — 16 MB each instead of 8, 64 MB in
    total — so a whole-series pack is not fetched a second time.
  v12.1.12.261: A subtitle archive is downloaded once per run, not again for every variant taken
    out of it.
  v12.1.12.260: A worker no longer shows a deferral note for a moment that has already passed.
  v12.1.12.259: Deferred background jobs (database, OSHash, post-processing, refetch) now retry at
    the time the log names instead of staying idle until the next scheduled run.
  v12.1.12.258: A forced subtitle track is now recognized by its track name too, not only by the
    file's flag — so its language no longer counts as already present.
  v12.1.12.257: The remaining cases where a worker row appeared without a run — switched off, a
    cycle already running, a restart before the run — write no row either.
  v12.1.12.256: A download held back by the spent SubDL daily limit no longer writes a worker
    row — nothing ran, so there is no status.
  v12.1.12.255: A correction that buys its gain by landing on a SONG is now taken back. The
    objective is the mean level in the voice band under a cue, and sung vocals are louder there
    than speech: on The Rainmaker S02E01 the opening block scored 0.640 placed on the title song
    against 0.538 where the dialogue actually is, so the fit moved 58 cues 15.5 s early and wrote
    two of them as 00:00:00,000 --> 00:00:00,000. Mean level cannot tell the two apart, but the
    ONSET at a cue start can — the level jumps when speech starts and does not jump over a
    through-composed song. Each segment is now checked after the fit: if it wins at least 0.10
    mean level over the unshifted placement while its cue starts show no onset, it takes its
    NEIGHBOUR's shift instead, the level the file already proves right next door. Calibrated on
    46 subtitles: exactly one segment in the corpus reaches the 0.10 floor (Rainmaker, +0.132,
    against a next-highest 0.057), so nothing else changes — Rainmaker now lands on −2.00 s, the
    same shift as the rest of its file, instead of −15.50 s.
  v12.1.12.254: The auto-sync no longer guesses a cue's kind from its capitalisation. A cue that is
    nothing but bracket groups — "(gunshot)", "(crowd shouting)", "[door slams]" — is a sound label
    and stays out of the fit, however it is written; embedded SDH tracks write these in lower case,
    where the capitals rule saw nothing (336 of 22 992 cues measured over 30 embedded HI tracks). The
    opposite direction matters more: a cue that STARTS with a bracket group but carries dialogue
    outside it ("(SCOFFS) Okay, so now what?", "[Shirley] Hey!") is dialogue and now feeds the fit
    again — the old rule dropped 1 848 such cues. Net effect on the same corpus: sound labels fall
    from 22.9 % to 16.3 % of the cues, and the fit gains 1 848 real dialogue anchors.
  v12.1.12.253: The auto-sync fits a subtitle on its DIALOGUE lines only: music and sound labels
    ("♪", "[door slams]", bare capitalised sound words) are dropped from the fit's input and
    re-attached afterwards by time, so each of them still moves with the dialogue around it. They
    used to sit in the cue list as silent voters, where they set the noise estimate, the
    segment-length floor and the block grid: on Line.of.Fire S01E02 that decided between one 6 s step
    (3 s off over four and a half minutes) and the two 3 s steps the plain subtitle shows, and on
    Lioness S02E06 a 12 s block was left standing. Both are gone; seven further files were already
    exact before and stay exact.
  v12.1.12.252: The deferral note under the workers list names the DAY of the next attempt ("next
    attempt Tue 6:10 AM") instead of a bare time ("6:10:00 AM"), which left open which morning was
    meant.
  v12.1.12.251: The spacing of the login/api/tmdb and library-directory rows did not work on a
    phone: they sat 40px apart (line + row margin + flex gap) while the workers block packs its lines
    at one line height. The gap and the row margin are gone, so both blocks share one rhythm.
  v12.1.12.250: The description under the refetch select reads "Refetch interval for download and
    upload." instead of "Unified refetch for both download and upload." - it now uses the words of the
    field label instead of a second name for the same thing.
  v12.1.12.249: The status word of the login/api/tmdb rows and of the library-directory rows is
    right-aligned on the row edge, in one column with the workers block - the labels have different
    widths, so a left-aligned message started at a different x on every line.
  v12.1.12.248: The library-directory rows show the library name and its state only ("Writable"), no longer
    the absolute path after it - "Movies  Writable - /media/Movies" said it twice and pushed the state
    off a phone-width line. The path stays in the API answer for diagnostics.
  v12.1.12.247: Status lines name the state only, not the row's own name a second time. "SubDL API ... API
    reachable" read as doppelt gemoppelt on a phone; it now says "reachable", and the login row says "OK"
    instead of "Login OK" - same for the failure lines ("wrong username/password" instead of "Login
    failed: wrong username/password"). Statements about the API KEY keep their wording: the key is a
    different subject than the endpoint.
  v12.1.12.246: "cancel" is grey now, and grey everywhere: the colour belongs to the STATE, not to the
    situation (operator, 19.10.2026: "wenn cancel grau ist ist cancel immer grau"). Same grey as skip
    (#767676) - in both cases nothing went wrong and nothing is owed - so yellow stays reserved for
    defer, where work is still owed. T157 pins the colour line and the pairing.
  v12.1.12.245: The cancellation now also carries the right time. 244 wrote the row through Finish(),
    which keeps an existing start because that is the real beginning of a run - the test bench then showed
    "cancel" next to a start three days old, since the column displays Started. A cancellation is not a
    run: MarkCancelled() stamps BOTH times with the moment of the stop, so the row reads "cancel" at the
    time it happened. The colour stays yellow like defer - the operator declined the grey change on
    19.10.2026, and the colour line is now pinned by T157 so it cannot drift.
  v12.1.12.244: A stop now also rewrites the worker row of the direction it cancels. Until now the
    pending fire was dropped correctly, but the row kept reading "defer" with the previous evening's
    detail, because only a run ever wrote it - measured on prod: fire cancelled at 01:34, lamp still
    yellow on defer from the night before. The row now says "cancel" (yellow, same colour: the work did
    not happen), carries the moment of the cancellation and the detail "fire cancelled - stopped by
    operator". Upload and download are handled independently, a stop without a pending fire changes
    nothing, and a row that cannot be written never makes the stop fail.
  v12.1.12.243: The status line under the worker list now says what does not run by itself - as
    words, not as a greyed lamp. "download off" and "upload off" mean the direction cannot start at
    all (switch, no library, no target language, no credentials); "download manual", "upload manual",
    "upload postprocessing manual", "database refresh manual" and "oshash refresh manual" mean it can
    start but nothing starts it by itself. OnArrival is an automatism and carries no word at all. The
    notes ride on the line that already reports a pending fire, from the same answer, so the two cannot
    disagree. Lamps, stored results and pending fires are untouched, so a run never disappears behind a
    switch.
  v12.1.12.242: The log line for a cancelled fire now prints the moment in UTC, as stored — it read a
    local time behind a "UTC" label. Documentation: the stop rule moved to §10 (scheduler) and the
    reasoning behind the recent rules is in METHODIK.md.
  v12.1.12.241: Pressing Stop now also cancels that direction's pending fire. Before, a stop only
    aborted the cycle that was running, and the armed fire brought the direction back minutes later —
    even wiping its own stop marker at run start. The other direction is untouched.
  v12.1.12.240: Which refusal counts as "no proven gain" is settled by significance, not by the score.
    A correction that is worse but NOT significantly worse is not evidence: it keeps the original in the
    reserved block and the run pulls the next candidate, exactly like an improvement that cannot prove
    itself. "No proven gain" is only: nothing to move, a shift below the 0.7 s floor, or the untreated
    file being significantly better (t <= -2). No correction is deployed without t > 2.
  v12.1.12.239: The auto-sync corrects from 0.7 s instead of 1.0 s — a real half-cue offset is no longer
    left alone, while the measured ~0.5 s offset of an in-sync subtitle still keeps good files untouched.
    A correction that improves the score but cannot prove it is no longer reported as "no proven gain":
    it keeps the original in the reserved block and the run pulls the next candidate instead. Every
    refusal now names its cause and carries the numbers it was decided on.
  v12.1.12.238: Three changes in what the upload reports. The filename carries the full MD5 of the
    bytes that were sent, between episode and language, so two uploads of the same episode are told
    apart by their content and the hash can be recomputed from the delivered file. The frame rate is
    reported instead of a fixed "unknown" — 0 stays only for rates SubDL does not know, and a broken
    average falls back to the real rate. The docs no longer claim a database engine the plugin
    stopped shipping.
  v12.1.12.237: The plugin no longer carries a second database engine — the one-time
    import of the old data file and the adoption of the pre-migration counters are gone.
  v12.1.12.236: The statistics row for prevented re-uploads is gone again; nothing else changed.
  v12.1.12.235: Three changes at the two ends of the pipeline. The download's filename fallback — the
    last resort, reached only for an item that carries no id at all — no longer guesses: an IMDb id a
    name states is looked up and used only when the title route agrees, a contradiction is refused and
    logged, a series without a year is resolved through the episode itself instead of TMDb's first hit,
    a film without a year stays unresolved rather than pinned to a namesake, an unusable title is
    refused, and names dressed in presentation forms are folded before parsing — measured on 1224 real
    SubDL names, that fallback resolved none of the 12 dressed-up ones before this change. The
    statistics gain a row counting uploads prevented as re-uploads of known subtitles, per subtitle
    track and sidecar and only for what a new arrival brought in; it reaches an existing database
    through a guarded ALTER TABLE without a schema bump. And the quality a subtitle reports on upload
    is read from its actual source — web, bluray, dvd, hdtv, cam — instead of the fixed web that
    shipped before.
  v12.1.12.234: Two settings texts shortened. The library selection line is one sentence and states
    that an empty selection stops every run; the language-code switch says what it does and its
    default in one sentence instead of four.
  v12.1.12.233: Clean-up round on the settings page and the plugin text. The database section now
    speaks of the plugin database throughout and its restore line is one sentence; the three cadence
    menus spell the non-automatic choice "Manual", and a stored "Never" reads as Manual; upload
    postprocessing defaults to Weekly for fresh installations. The plugin's description ends with
    "Created by AI under the directions of the maintainer." on the card and in the catalog, and every
    SubDL search names the integration.
  v12.1.12.232: Follow-up to 231 — the identifying agent now rides on every SubDL call, not only on
    the main ones. The plugin builds its SubDL clients at several places, and four of them (the
    status probe, the quota read, the upload postprocessing check and the upload pipeline's own
    pass) sent no agent at all, so their calls arrived unidentified. One factory builds all of them
    now.
  v12.1.12.231: The database refresh now refreshes the query statistics as well, and SubDL can see
    who is calling. The refresh ran VACUUM alone — that shrinks the file but leaves the query
    planner guessing which index to use. It now runs ANALYZE in the same pass, which costs one
    database page; measured on this schema, the plan for one of the plugin's own lookups moved off
    the worse index and onto the selective one. Separately, every API call now names the
    integration (client=other) and carries the real plugin version in its User-Agent, which until
    now reported "1.0" for every release.
  v12.1.12.230: Timestamps show local time again on a server that does not run on UTC.
    Run times, the statistics period and diagnostics came from the database without a
    timezone designator, and browsers read such a value as LOCAL time — on a Berlin
    server a run stored as 07:36 UTC read 7:36 AM although it happened at 9:36 AM. The
    stamps are now marked as UTC before formatting. Also: the refetch description names
    its two directions outright, "both download and upload".
  v12.1.12.229: Removes an experimental subtitle-alignment method that shipped in 228 by
    mistake. Nothing a run does changes - the alignment is the same one 227 used, unchanged.
  v12.1.12.228: The Auto-Sync numbers in the log are written with a decimal point, not with
    whatever separator the machine prefers. The same line read "t = +8,62" on one day and
    "t = +8.62" on the next, from unchanged code, because interpolated numbers follow the
    host culture. Nothing about the alignment itself changed.
  v12.1.12.227: The Auto-Sync row is reachable while it runs. Start and finish sat in one
    synchronous block, so the light was never blue and its duration read as ~0. It now opens
    with the download run and is closed by whoever opened it - including a cancelled run.
  v12.1.12.226: Every gate in "Quality gates (before upload)" names its default. Three of the five
    (minimum cue count, validate SRT, check sync) had none - the two written later did, which is how
    the gap arose. A default is what makes a switch readable without flipping it.
  v12.1.12.225: The upload switch reads "Continue after daily limit" like the download one - the
    extra "API" made two controls that do the same thing look like they behave differently.
  v12.1.12.224: "Target languages (download, required)" is a real heading now, and it names the
    direction. It was a field caption (label in an inputContainer) whose text did not say whose
    languages, while every other block on the General tab is introduced by an h3.
  v12.1.12.223: Target languages (download, required) moves to the General tab, directly under
    the library selection, so the first page carries what a run needs. Moved, not copied - a
    second control would render on both tabs and the last one read would win at save.
  v12.1.12.222: A worker row may not claim work the run did not do. The Download row stored
    "20 downloaded, 22 unavailable, 1 skipped" while carrying DryRun=1, and the run's own log
    line said "20 would have saved" - DescribeDirectionRun took the summaries but never the
    mode. The label now follows the log's words ("would have saved" / "would have uploaded");
    the counters are untouched, because a dry run's numbers are honest about what it FOUND.
  v12.1.12.221: The dry run consumes no work. The download outcome handler read the UPLOAD
    dry-run flag, so a download dry run marked every item it had only described as Done and the
    next real run skipped them. Each direction now consults its own flag. And the Auto-Sync row
    is STARTED as well as finished - it was only ever closed, so it reported a stale start time
    (prod: nine hours for 274 s of alignment).
  v12.1.12.220: A DOWNLOAD dry run escapes the DOWNLOAD brake, not the search one. With the account
    at 50/50 the probe from F-M331 held back the very run meant to report what WOULD happen, so the
    dry-run test could not be started at all. A dry run fetches no file, so the download counter no
    longer stops it; the search allowance keeps holding it in both modes, because a dry run does
    search every item and prints only what those answers carry.
  v12.1.12.219: "Only missing languages" gets a real second mode. Off now means once per language,
    whatever the file already carries: only our own recorded download closes a pair, so library
    sidecars, embedded tracks and the stream list stop counting. The fetched file is numbered against
    the files actually in the directory instead of overwriting the one already there, and the label
    drops its old "(embedded count as present)" parenthetical.
  v12.1.12.218: Three page texts. The reset warning is one short sentence again ("Deletes all persistent
    state. A backup is kept. Rebuild costs API quota."), the postprocessing description drops its trailing
    pointer at the button beneath it, and the "Only missing languages" checkbox states its default (on).
  v12.1.12.217: file-retry is removed from code and GUI - the file-missing give-up, its setting and
    its tracker type are gone. The gone-file case is the Database Refresh's job now (new phase 1b,
    path-keyed and behind the same root fail-safe as its neighbours), which is what the operator's
    "alleinige Aufgabe database refresh" asks for. Two page texts corrected with it: the reset warning
    no longer claims the dedup state survives (it is exactly what a reset deletes), and the pacing
    field drops its "rate, not a limit" aside.
  v12.1.12.216: All three maintenance menus now read just "Manual" - the appended "no scheduled run,
    use the button below" is gone. The button sits directly under its description; nothing else changed.
  v12.1.12.215: The postprocessing button now starts the scheduled task instead of calling the job's
    API endpoint. Both run the work, but only the task writes the status row - measured on prod, the endpoint
    finished correctly while the list stayed empty, so the run looked like it never happened.
  v12.1.12.214: The upload binding on postprocessing now applies to the scheduled run only - a manual
    run always works, with the upload direction on or off. The two gates that refused a manual trigger
    are gone; the schedule itself is still held back while upload is disabled, and the page says so.
  v12.1.12.213: Upload postprocessing joins the other two jobs with a manual start button under its
    description, and its disabling option is now labelled "Manual" instead of "Never" - the stored
    value is unchanged, so an existing setting keeps meaning what it meant. Its button calls the job's
    own endpoint rather than the generic task starter, so a press with the upload direction switched
    off says so instead of looking like a finished run.
  v12.1.12.212: The id-resolution give-up is gone. An item whose id could not be resolved used to be
    retired after three failed attempts, which meant the ladder never ran again for it; now the next
    run tries again, and the setting with its field is gone. The database refresh and the OSHash
    refresh each got a manual start button on the configuration page, under their own description,
    and their disabling option is now labelled "Manual" instead of "Never" - the stored value is
    unchanged, so an existing configuration keeps meaning what it meant. The upload postprocessing
    interval keeps "Never" because it has no such button.
  v12.1.12.212: The id-resolution give-up is gone. An item whose id could not be resolved used to be
    retired after three failed attempts, which meant the ladder never ran again for it; now the next
    run tries again. The setting and its field are gone with it. Also: the database and OSHash
    refreshes each got a manual start button on the configuration page, under their own description,
    so they can be run on the spot instead of waiting for the schedule. Both changes keep every
    existing cadence setting exactly as it was.
  v12.1.12.211: Two settings became one. "Auto-Sync attempts and max. download/search limit" now
    decides how many candidates per language are SEARCHED and how many the downloader may pull
    before giving up; "Max candidates per language" is gone. At the old default of 3 the cap always
    stopped the walk first, so the correction attempts never took effect - the two numbers could
    contradict each other silently. With Auto-Sync on, only candidates the fit could not resolve
    count against the limit, not ones a quality gate refused. With Auto-Sync off the walk stopped
    after the first candidate of each language; it now pulls the configured number.
  v12.1.12.210: The allowance gate now works like the download switch, at the switch's own two
    places, and the check moved out of the seeder. The seeder fills queues and does not decide
    policy: it takes a plain flag beside DownloadEnabled and asks the API nothing. The dispatcher
    probes once per cycle before the download seed - only when the cycle covers the download
    direction - and a spent download OR search allowance then holds the queue back AND stops the
    run, exactly as switching the direction off does. A read that fails is not a verdict.
  v12.1.12.209: The IMDb/TMDb match loses its switch, and a spent allowance no longer starts the
    downloader. A filename-parsed title search could fetch a wrong-year release with the same name;
    the hard gate is the only position that stays correct, so the option went and not the gate. And
    the seeder now asks the SubDL counters once per scan, BEFORE it fills the download queue: with
    the 50/day download limit or the search allowance spent, the queue is not filled AND the run is
    refused, so a cycle stops costing its search allowance for saves that cannot happen. Measured on
    prod the day of the order: the download limit was spent from 05:59, and four further cycles each
    walked ~1000 queued items, spent the day's search allowance (59 -> 194) and saved nothing.
    An unreadable counter is NOT treated as spent - a network hiccup must not cost a day.
  v12.1.12.208: One lit lamp, for the worker that is working. The cycle marked both directions as
    running when it STARTED, so the Seeder scanned while Download and Upload were already blue from
    the same cycle. Each direction now marks itself when its own run begins and closes its own row,
    start to finish, so exactly one lamp is blue at a time. Also: the upload row counts the skips it
    really keeps (FilesSkipped), so a run that examined files and refused them all says so instead
    of reading as untouched.
  v12.1.12.207: A worker row no longer reads "nothing to do" for a run that examined items and
    refused them all. Live on prod: the upload looked at five files, rejected every one for a missing
    id, and its row said nothing had happened. The row now names the skipped count too.
  v12.1.12.206: Same fixes as 12.1.12.205, with the assembly version corrected. 205 shipped a
    DLL that still identified itself as 12.1.12.204, so Jellyfin installed the package while its
    loader reported the old assembly and the version never took effect. The release script now
    refuses a build whose AssemblyVersion and FileVersion disagree with the version.
  v12.1.12.205: Every worker row now reports only its own result - until now the green line handed
    the seeder's sentence to the download AND upload row, so two rows read identically. The scan also
    stopped printing the direction it never looked at, and the seeder row sums a both-direction cycle
    instead of letting the second leg overwrite the first. Settings page: the download tab reads in
    the order the cycle works - continue after daily limit, follow-up rounds, automatically
    synchronize. No setting changed value.
  v12.1.12.204: A library scan is ~50x faster. The store committed once per ROW — and a commit is a
    disk sync — so a pass over prod's library issued 9 644 writes at 45 ms each and ran eight minutes
    while queueing nothing. Writes now accumulate and commit in batches, and observing an embedded
    track no longer restamps its parent media row once per track. Same workload: 4 800 writes in
    2 846 ms instead of 138 650 ms.
  v12.1.12.203: A run that uploaded subtitles is no longer marked failed afterwards. The status row
    for the audio alignment was written on the upload path too, where there is no download to report,
    so every upload run threw and both the Download and Upload lights turned red although both had
    finished green. The row is skipped when there is no download. Also: a failed unpack during a
    deploy no longer leaves a half-installed plugin.
  v12.1.12.202: The data store is SQLite now, through the Entity Framework Core that Jellyfin already
    ships, and the plugin writes its own file (subdl-scribe.sqlite) — never Jellyfin's database, which
    offers plugins no interface and is rebuilt by its own migrations. A new version that meets an old
    data file IMPORTS it once: measured against a real file, 117 of 117 rows over ten areas, including
    the retry budgets and the burned-candidate verdicts, which are work rather than data — losing them
    re-fetches candidates that were already screened. The old file is kept. 35 KB smaller package
    (1,337,266 -> 1,301,728 B): not the full engine weight, because the import still needs it to read.
  Older entries (before v12.1.12.192) were removed on 08.10.2026 to keep this file
  and the shipped ZIP small. They remain in the git history: git log -- build.yaml .
  v12.1.12.201: The configuration page carries its JavaScript once. The second page
    script was never loaded (measured in a browser), so it, its ConfigJs route, its
    page registration and its resource entry are gone — 65 KB less in the DLL.
  v12.1.12.200: The auto-sync is a worker of its own now: it is handed the subtitle and
    hands back a status and its output, instead of the download guessing its outcome.
    Its row goes red for its own failures only, not for the download's.
  v12.1.12.199: Two statistics rows are gone, and with them their counters: the type row and
    the year-filter row. The behaviour they measured is unchanged - the file name still
    decides type and episode, a year-filtered search still retries without the year.
  v12.1.12.198: The worker is named Auto-Sync too, like the statistics row, and the numbers
    under Statistics are right-aligned in a column sized for six digits.
  v12.1.12.197: Spelling: the statistics row reads "Downloads: Auto-Sync".
  v12.1.12.196: Shorter statistics rows: "Downloads: searches run without the year"
    and "Type (movie/series) adjusted, both dir".
  v12.1.12.195: The auto-sync's light lives in the Workers list and nowhere else - the copy
    under the download switch is gone. One readout, one place.
  v12.1.12.194: The statistics row is shorter now: "Downloads: Auto-Synch" instead of the long
    sentence that restated the switch. A row in a table of counts names its counter.
  v12.1.12.193: The audio alignment has its own status light now - in the Workers list and
    directly under the download switch, with the same words and colours as every other worker.
    The switch says what it does at last: "Automatically synchronize subtitle to spoken track".
    The statistics count only alignments that really happened, so a subtitle that was already
    fine is no longer reported as one that the run moved. The postprocessing row is named for
    its direction: "Upl. Postproc.".
  v12.1.12.192: A subtitle the alignment finds nothing wrong with is no longer treated as a
    failure. It is kept as the best version of its language, taking index 01 upward like a
    corrected file, together with an identical copy from index 99 downward - and the download
    stops there instead of hunting further candidates, which no longer spends quota on a file
    that cannot be beaten. Only files that are actually wrong (beyond the shift limit, too few
    cues) keep going into the reserved range and keep the hunt alive.
